# Foundry configuration — Batch 1 scaffold.
#
# Reproducibility under NFR-0 demands an explicitly pinned compiler and EVM
# target: Foundry's Config::default() ships evm_version = Osaka and
# auto_detect_solc = true, either of which can silently drift the build across
# machines. We pin both.
#   solc pin  -> foundry-context @ f1bcb75 crates/config/src/lib.rs#L250-L293
#   defaults  -> foundry-context @ f1bcb75 crates/config/src/lib.rs#L2711-L2777
#   [fuzz]    -> foundry-context @ f1bcb75 crates/config/src/fuzz.rs#L8-L57
# solc 0.8.35 existence verified 2026-07-02 via
#   `gh api repos/ethereum/solidity/releases/tags/v0.8.35` (published 2026-04-29).

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

solc = "0.8.35"
auto_detect_solc = false
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Strip the solc metadata hash so bytecode is a pure function of source +
# settings — a reproducible-build stance consistent with NFR-0.
bytecode_hash = "none"

# Fuzz/invariant campaigns arrive with the contracts in Batches 2-3. Scaffold
# the config now with an explicit run count and a PINNED seed: random-per-run
# fuzzing is at odds with NFR-0 determinism. Seed bytes are ASCII "tieout".
[fuzz]
runs = 256
seed = "0x7469656f7574"

[invariant]
runs = 256
depth = 128
fail_on_revert = true

[fmt]
line_length = 100
number_underscore = "thousands"

# --- Deploy ladder (Batch 3, Story 3.3) -------------------------------------
# Anvil (local) -> Base Sepolia (84532) rehearsal -> single Base mainnet (8453)
# canonical anchor. Every non-local rung leaves the machine and HALTS for
# explicit approval before broadcasting.
#
# Secrets stay OUT of this committed file: both sections use ${VAR} env
# interpolation, resolved lazily only when an alias is actually used (a missing
# var is then a hard error, never a silent default). Building/testing/fuzzing
# do not touch these sections. Both are STANDALONE top-level tables (like
# [fuzz] above), not keys under [profile.default].
#   [rpc_endpoints] -> foundry-context @ f1bcb75 crates/config/src/endpoints.rs#L11-L75
#   [etherscan]     -> foundry-context @ f1bcb75 crates/config/src/etherscan.rs#L63-L98
[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

# `chain` MUST be Foundry's NAMED chain — `base` (8453) / `base-sepolia` (84532,
# hyphenated) — not the numeric id and not the alias name. An Etherscan-V2
# multichain key covers both chains with one key; if v1.7.1 instead needs a
# per-chain Basescan endpoint, add an explicit `url = "..."` to the alias
# (confirm live before the mainnet rung — see the story's operational gate).
[etherscan]
base = { chain = "base", key = "${ETHERSCAN_API_KEY}" }
base_sepolia = { chain = "base-sepolia", key = "${ETHERSCAN_API_KEY}" }
